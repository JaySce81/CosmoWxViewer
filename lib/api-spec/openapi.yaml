openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: DESI and SPARC universe visualization API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cosmos
    description: Catalog-based cosmological data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /galaxies:
    get:
      operationId: getGalaxies
      tags: [cosmos]
      summary: Get galaxies in true comoving space
      description: Returns individually sampled DESI or SPARC catalog records positioned with flat ΛCDM comoving distances. No redshift-shell coordinates are used.
      parameters:
        - name: sample
          in: query
          schema:
            type: integer
            default: 80000
            minimum: 1
            maximum: 300000
          description: Maximum number of catalog records to return
        - name: zmin
          in: query
          schema:
            type: number
            default: 0
          description: Inclusive minimum measured redshift
        - name: zmax
          in: query
          schema:
            type: number
            default: 3
          description: Inclusive maximum measured redshift
        - name: dataset
          in: query
          schema:
            type: string
            default: all
          description: Exact discovered dataset name, or all
      responses:
        "200":
          description: Galaxy records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalaxyResponse"
        "503":
          description: Catalogs are still loading
  /galaxies/stats:
    get:
      operationId: getGalaxyStats
      tags: [cosmos]
      summary: Get catalog statistics and measurement availability
      responses:
        "200":
          description: Catalog statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalaxyStats"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Cosmology:
      type: object
      required: [H0, OmegaM, OmegaL, C_LIGHT]
      properties:
        H0:
          type: number
          description: Hubble constant in km/s/Mpc
        OmegaM:
          type: number
          description: Matter density parameter
        OmegaL:
          type: number
          description: Dark-energy density parameter
        C_LIGHT:
          type: number
          description: Speed of light in km/s
    Galaxy:
      type: object
      required:
        - x
        - y
        - z
        - ra
        - dec
        - redshift
        - distance
        - dataset
        - datasetClass
        - diameterKpc
        - diameterSource
        - rotationSpeedKms
        - rotationDirection
        - lineOfSightVelocityKms
        - transverseVelocityKms
        - vx
        - vy
        - vz
        - speedKms
        - velocitySource
      properties:
        x:
          type: number
          description: Equatorial Cartesian comoving X in Mpc
        y:
          type: number
          description: Equatorial Cartesian comoving Y in Mpc
        z:
          type: number
          description: Equatorial Cartesian comoving Z in Mpc
        ra:
          type: number
          description: Right ascension in degrees
        dec:
          type: number
          description: Declination in degrees
        redshift:
          type: number
          description: Individually measured spectroscopic redshift
        distance:
          type: number
          description: Comoving radial distance in Mpc
        scaleFactor:
          type: number
          description: Scale factor at emission, a = 1/(1+z)
        physicalDistanceAtEmissionMpc:
          type: number
          description: Physical radial distance at emission, a times comoving distance
        dataset:
          type: string
        datasetClass:
          type: string
          enum: [ELG, BGS, LRG, SPARC]
        diameterKpc:
          type: number
          description: Catalog diameter, or documented typical class fallback, in kpc
        diameterSource:
          type: string
          enum: [catalog, typical-class-range]
        rotationSpeedKms:
          type: [number, "null"]
          description: SPARC/catalog rotation speed when supplied
        rotationDirection:
          type: [string, "null"]
          enum: [CW, CCW, null]
        lineOfSightVelocityKms:
          type: number
          description: Relativistic radial velocity derived from this record's spectroscopic redshift
        transverseVelocityKms:
          type: [number, "null"]
          description: Catalog transverse velocity when supplied
        vx:
          type: number
          description: Measured radial motion vector X in km/s
        vy:
          type: number
          description: Measured radial motion vector Y in km/s
        vz:
          type: number
          description: Measured radial motion vector Z in km/s
        speedKms:
          type: number
          description: Magnitude of available velocity components in km/s
        velocitySource:
          type: string
          enum: [spectroscopic-redshift]
    GalaxyResponse:
      type: object
      required: [galaxies, total, returned, cosmology, dataAvailability]
      properties:
        galaxies:
          type: array
          items:
            $ref: "#/components/schemas/Galaxy"
        total:
          type: integer
        returned:
          type: integer
        cosmology:
          $ref: "#/components/schemas/Cosmology"
        dataAvailability:
          $ref: "#/components/schemas/DataAvailability"
    DataAvailability:
      type: object
      required: [rotation, transverseMotion, diameter]
      properties:
        rotation:
          type: boolean
        transverseMotion:
          type: boolean
        diameter:
          type: boolean
    DatasetInfo:
      type: object
      required: [name, count, datasetClass, zMin, zMax, label]
      properties:
        name:
          type: string
        count:
          type: integer
        datasetClass:
          type: string
          enum: [ELG, BGS, LRG, SPARC]
        zMin:
          type: number
        zMax:
          type: number
        label:
          type: string
    MeasurementAvailability:
      type: object
      required: [rotationSpeed, rotationDirection, transverseMotion, catalogDiameter]
      properties:
        rotationSpeed:
          type: boolean
        rotationDirection:
          type: boolean
        transverseMotion:
          type: boolean
        catalogDiameter:
          type: boolean
    GalaxyStats:
      type: object
      required: [datasets, totalGalaxies, zRange, cosmology, availableMeasurements, ready]
      properties:
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetInfo"
        totalGalaxies:
          type: integer
        zRange:
          type: object
          required: [min, max]
          properties:
            min:
              type: number
            max:
              type: number
        cosmology:
          $ref: "#/components/schemas/Cosmology"
        availableMeasurements:
          $ref: "#/components/schemas/MeasurementAvailability"
        ready:
          type: boolean