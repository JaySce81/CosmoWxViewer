kind = "web"
previewPath = "/"
title = "Cosmic Web Visualizer"
version = "1.0.0"
id = "artifacts/cosmic-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19074

[services.development]
run = "pnpm --filter @workspace/cosmic-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cosmic-web", "run", "build" ]
publicDir = "artifacts/cosmic-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19074"
BASE_PATH = "/"
